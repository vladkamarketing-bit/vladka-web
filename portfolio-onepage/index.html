<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0F">
<title>Vlaďka Horáková · webdesignérka · Praha</title>
<meta name="description" content="Weby s rezervačním systémem pro kavárny, studia a ordinace. Zatímco pracujete, kalendář se plní.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DATA · TOKENS  (barvy, rozestupy, písma – upravujte jen tady)
   ===================================================================== */
:root{
  --bg:#0C0C0F; --surface:#141418; --ink:#EEEDF3; --ink-2:#B6B4C0; --ink-3:#787684;
  --line:rgba(238,237,243,.1); --grid:rgba(238,237,243,.08);
  --accent:#9B85FF; --accent-rgb:155,133,255; --star:#F5C451;
  --g1:#1D1740; --g2:#7C5CFF; --g3:#0C0C0F;
  --r:14px; --pad:clamp(20px,4vw,56px); --maxw:1360px; --ease:cubic-bezier(.22,1,.36,1);
  --space-section:clamp(96px,11vw,160px);
  --space-head:clamp(40px,5vw,72px);
  --space-card:clamp(24px,2.8vw,40px);
  --gap:16px;
  --gap-card:clamp(28px,3.4vw,48px);
  --edge:max(var(--pad),calc(50% - var(--maxw)/2 + var(--pad)));
  --serif:'Newsreader',Georgia,serif; --sans:'Inter Tight',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --btn-ink:#0C0C0F;
}
.light{
  --bg:#EEEEF0; --surface:#F7F7F8; --ink:#0C0C0F; --ink-2:#3F3E4A; --ink-3:#6B6A76;
  --line:rgba(12,12,15,.12); --accent:#6B48F0; --accent-rgb:107,72,240; --btn-ink:#fff;
  background:var(--bg); color:var(--ink); position:relative; z-index:2;
}
/* ===================================================================== */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,blockquote,figure{margin:0}
em{font-style:italic}
::selection{background:var(--accent);color:#0C0C0F}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);position:relative;z-index:2}
.eyebrow{font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.mono-s{font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.stars{color:var(--star);letter-spacing:.1em}
section{position:relative;border-top:1px solid var(--line);padding:var(--space-section) 0}

/* ---------- gridlines ---------- */
.gl{position:fixed;top:0;bottom:0;width:1px;background:var(--grid);z-index:1;pointer-events:none}
.gl-l{left:var(--edge)} .gl-r{right:var(--edge)}

/* ---------- headings ---------- */
.h2{font:400 clamp(40px,6vw,96px)/1.02 var(--serif);letter-spacing:-.025em;max-width:13em}
.h1 em,.h2 em,.fin-h em,.mid-t em{color:var(--accent);font-style:italic}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-card);margin-bottom:var(--space-head)}
.sh .eyebrow{flex:none;text-align:right;padding-bottom:.6em}
.w{display:inline-block;vertical-align:top;overflow:hidden;padding:.16em .14em .14em 0;margin:-.16em -.14em -.14em 0}
.w>span{display:inline-block;will-change:transform}
.anim .split .w>span{transform:translateY(120%)}
.anim .rv{opacity:0;transform:translateY(32px)}

/* ---------- cursor ---------- */
.cur{position:fixed;left:0;top:0;z-index:100;pointer-events:none;display:none;opacity:0;transition:opacity .3s}
.cur.live{opacity:1}
@media (hover:hover) and (pointer:fine){.cur.on{display:block}}
.cur>*{position:absolute;left:0;top:0;border-radius:50%;transition:transform .45s var(--ease),opacity .3s}
.c-dot{width:10px;height:10px;margin:-5px 0 0 -5px;background:#9B85FF}
.c-ring{width:40px;height:40px;margin:-20px 0 0 -20px;border:1px solid #9B85FF;opacity:0;transform:scale(.3)}
.c-big{width:76px;height:76px;margin:-38px 0 0 -38px;background:#9B85FF;color:#0C0C0F;display:grid;place-items:center;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;opacity:0;transform:scale(.2)}
.cur.ring .c-dot,.cur.big .c-dot{opacity:0;transform:scale(0)}
.cur.ring .c-ring{opacity:1;transform:none}
.cur.big .c-big{opacity:1;transform:none}

/* ---------- nav ---------- */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:80;padding:6px;background:#141418;border:1px solid rgba(238,237,243,.1);border-radius:999px;transition:transform .6s var(--ease),border-radius .4s;width:max-content;max-width:calc(100% - 32px);color:#EEEDF3}
.nav.hide{transform:translate(-50%,-150%)}
.nav-row{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding-right:10px;font-size:15px;font-weight:500;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:57% 30%}
.nav-links{position:relative;display:flex}
.nav-links a{position:relative;z-index:1;padding:8px 14px;font-size:15px;color:#B6B4C0;border-radius:999px;transition:color .3s}
.nav-links a:hover,.nav-links a.on{color:#EEEDF3}
.ind{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;background:rgba(238,237,243,.08);opacity:0;transition:transform .5s var(--ease),width .5s var(--ease),opacity .3s}
.nav-cta{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:#EEEDF3;color:#0C0C0F;font-weight:600;font-size:15px;white-space:nowrap;transition:background .3s}
.nav-cta:hover{background:#9B85FF}
.burger{display:none;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(238,237,243,.14);background:transparent;position:relative;cursor:pointer;padding:0}
.burger span{position:absolute;left:12px;width:16px;height:1.5px;background:#EEEDF3;transition:transform .4s var(--ease)}
.burger span:first-child{top:16px}.burger span:last-child{top:22px}
.nav.open .burger span:first-child{transform:translateY(3px) rotate(45deg)}
.nav.open .burger span:last-child{transform:translateY(-3px) rotate(-45deg)}
.nav-menu{display:none}
@media (max-width:980px){
  .nav{left:16px;right:16px;transform:none;width:auto;max-width:none;border-radius:24px}
  .nav.hide{transform:translateY(-150%)}
  .nav-links{display:none}
  .nav-cta{margin-left:auto}
  .burger{display:block}
  .nav-menu{display:block;max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}
  .nav.open .nav-menu{max-height:440px}
  .nav-menu nav{padding:8px 10px 10px}
  .nav-menu a{display:block;font:400 30px/1.2 var(--serif);padding:12px 4px;border-top:1px solid rgba(238,237,243,.1)}
}
@media (max-width:440px){.brand .ln{display:none}.nav-cta{font-size:14px;padding:0 14px}}

/* ---------- buttons / CTA block ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 28px;border-radius:999px;font:600 16px/1 var(--sans);white-space:nowrap;cursor:pointer;border:0;transition:background .3s,color .3s,border-color .3s}
.btn-primary{background:var(--accent);color:var(--btn-ink)}
.btn-primary:hover{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(238,237,243,.32)}
.btn-ghost:hover{border-color:var(--accent)}
.arr{display:inline-block;transition:transform .45s var(--ease)}
.btn:hover .arr{transform:rotate(-45deg)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-card) calc(var(--space-card)*1.5);margin-top:var(--space-card)}
.cta-note{margin-top:12px;font-size:14px;line-height:1.4;color:var(--ink-3)}
.cta-note a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(var(--accent-rgb),.6)}
.cta-note a:hover{color:var(--accent)}
.proof{display:flex;align-items:center;gap:14px;font-size:15px;line-height:1.4;color:var(--ink-2)}
.avs{display:flex;flex:none}
.avs img{width:38px;height:38px;border-radius:50%;border:2px solid var(--bg);object-fit:cover;margin-left:-10px}
.avs img:first-child{margin-left:0}
.proof b{color:var(--ink);font-weight:600}

/* ---------- hero ---------- */
.hero{border-top:0;padding:clamp(96px,11vh,120px) 0 calc(var(--space-card)*1.5);overflow:hidden}
.hero-gl{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.7}
.hero-fade{position:absolute;inset:0;z-index:0;background:linear-gradient(to top,var(--bg) 0%,rgba(12,12,15,0) 50%)}
.cells{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hero .cells{-webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 92%);mask-image:linear-gradient(to bottom,#000 45%,transparent 92%)}
.hero-label .dot{color:var(--accent)}
.h1{margin-top:calc(var(--space-card)*.75);font:400 clamp(46px,7.6vw,118px)/1 var(--serif);letter-spacing:-.035em;max-width:11em}
.hero-sub{margin-top:var(--space-card);max-width:900px;font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:var(--ink-2)}

/* ---------- impact ---------- */
.impact{padding:var(--space-card) 0 calc(var(--space-card)*1.5)}
.imp{display:grid;grid-template-columns:repeat(3,1fr);column-gap:0}
.imp-c{padding-right:var(--space-card)}
.imp-line{position:relative;height:1px;background:var(--accent);transform-origin:left;margin-bottom:var(--space-card)}
.imp-line::before{content:"";position:absolute;left:0;top:-3px;width:1px;height:7px;background:var(--accent)}
.imp-n{display:block;font:400 clamp(40px,5.2vw,80px)/1 var(--serif);letter-spacing:-.03em}
.imp-c:first-child .imp-n{color:var(--accent)}
.imp-cap{margin-top:12px;font-size:15px;line-height:1.4;color:var(--ink-2)}
.imp-who{margin-top:8px}
@media (max-width:700px){
  .imp{grid-template-columns:1fr;row-gap:var(--space-card)}
  .imp-c{display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-card);align-items:center;padding-right:0}
  .imp-line{grid-column:1/-1;margin-bottom:calc(var(--space-card)*.75)}
  .imp-cap{margin-top:0}
}

/* ---------- logos ---------- */
.logos{padding:var(--space-card) 0}
.logos-label{position:relative;z-index:2;text-align:center;margin-bottom:var(--space-card)}
.logos-label span{display:inline-block;background:var(--bg);padding:6px 14px;border-radius:999px}
.mq{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq 48s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-g{display:flex;flex:none}
.lg{height:92px;display:flex;align-items:center;padding:0 clamp(28px,3.6vw,56px);color:var(--ink-3);white-space:nowrap;font-size:22px;line-height:1;transition:color .3s}
.lg:hover{color:var(--ink)}
.lg0{font-family:var(--sans);font-weight:600;letter-spacing:.22em;font-size:19px}
.lg1{font-family:var(--serif);font-style:italic;font-size:26px}
.lg2{font-family:var(--mono);font-size:18px}
.lg3{font-family:var(--serif);font-size:25px}
.lg4{font-family:var(--sans);font-weight:600;letter-spacing:-.04em;font-size:26px}
.lg5{font-family:var(--sans);font-weight:500;letter-spacing:.04em;font-size:19px}
.lg6{font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px;letter-spacing:-.02em}
.lg7{font-family:var(--mono);font-weight:500;letter-spacing:.06em;font-size:17px}
.lg8{font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:.02em}
.lg9{font-family:var(--sans);font-weight:400;letter-spacing:.3em;font-size:16px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- pains ---------- */
.pains{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pain{background:var(--bg);padding:var(--space-card);display:flex;flex-direction:column;gap:calc(var(--space-card)/2);min-height:clamp(240px,22vw,320px)}
.pain h3{margin-top:auto;font:400 clamp(26px,2.3vw,34px)/1.1 var(--serif);letter-spacing:-.015em}
.pain p{color:var(--ink-2);font-size:17px;line-height:1.5}
@media (max-width:860px){.pains{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.pains{grid-template-columns:1fr}.pain{min-height:0}}

/* ---------- outcomes ---------- */
.outs{border-top:1px solid var(--line)}
.out{display:grid;grid-template-columns:80px minmax(0,1.1fr) minmax(0,1fr);gap:var(--space-card);align-items:baseline;padding:var(--space-card) 0;border-bottom:1px solid var(--line);background:var(--bg)}
.out h3{font:400 clamp(26px,2.5vw,38px)/1.1 var(--serif);letter-spacing:-.015em}
.out p{color:var(--ink-2);max-width:520px}
.sec-cta{margin-top:var(--space-head)}
@media (max-width:860px){.out{grid-template-columns:1fr;gap:10px}}

/* ---------- work / cases ---------- */
.cases{display:flex;flex-direction:column;gap:var(--gap-card)}
.case{position:sticky;top:11vh;min-height:min(690px,86vh);display:grid;grid-template-columns:1.05fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transform-origin:50% 0;will-change:transform}
.case-shade{position:absolute;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none}
.case-l{position:relative;z-index:2;padding:var(--space-card);display:flex;flex-direction:column;gap:calc(var(--space-card)/2)}
.case-t{margin-top:8px;font:400 clamp(32px,3vw,46px)/1.05 var(--serif);letter-spacing:-.02em}
.metric{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:var(--space-card);align-items:end}
.m-mask{overflow:hidden;padding:.16em .14em .14em 0;margin:-.16em -.14em -.14em 0}
.m-n{display:inline-block;font:400 clamp(52px,5.6vw,88px)/1 var(--serif);letter-spacing:-.035em;color:var(--accent);white-space:nowrap}
.m-cap{margin-top:10px;font-size:16px;line-height:1.35;color:var(--ink)}
.m-per{margin-top:6px}
.bars-box{position:relative;height:104px;display:flex;align-items:flex-end;gap:16px;padding:0 10px;border-bottom:1px solid var(--line)}
.bar{position:relative;flex:1;height:100%}
.bar i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h)*78%);background:rgba(238,237,243,.22);border-radius:3px 3px 0 0;transform-origin:50% 100%}
.bar.po i{background:var(--accent)}
.bar b{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--h)*78% + 6px);font:500 12px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.bar.po b{color:var(--accent)}
.bars-lab{display:flex;gap:16px;padding:8px 10px 0;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink-3)}
.bars-lab span{flex:1;text-align:center}
.sec{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-top:1px solid var(--line);padding-top:calc(var(--space-card)/2)}
.sec-n{font:400 clamp(26px,2.2vw,32px)/1 var(--serif);letter-spacing:-.02em}
.sec-cap{font-size:15px;color:var(--ink-2)}
.story{border-top:1px solid var(--line)}
.story>div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0}
.story>div+div{border-top:1px solid var(--line)}
.story dt{font:400 12px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.story dd{font-size:16px;line-height:1.5;color:var(--ink-2)}
.story dd.sol{color:var(--ink)}
.cq{margin-top:auto;border-top:1px solid var(--line);padding-top:calc(var(--space-card)/2)}
.cq .stars{font-size:13px}
.cq p{margin-top:8px;font:400 clamp(18px,1.45vw,21px)/1.35 var(--serif)}
.cq cite{display:block;margin-top:10px;font:normal 400 12px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.04em}
.case-r{position:relative;z-index:2;padding:var(--space-card);display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 55% at 55% 50%,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),0) 72%)}
.mock{position:relative;width:100%;border-radius:12px;border:1px solid var(--line);background:#0C0C0F}
.mock-bar{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-bottom:1px solid var(--line)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:rgba(238,237,243,.18)}
.url{margin:0 auto;transform:translateX(-14px);font:400 11px/1 var(--mono);color:var(--ink-3);background:rgba(238,237,243,.06);padding:6px 14px;border-radius:999px}
.mock-view{position:relative;height:clamp(300px,33vw,460px);overflow:hidden;border-radius:0 0 12px 12px}
.mock-view img{width:100%;height:115%;object-fit:cover;filter:saturate(.85)}
.phone{position:absolute;right:-8px;bottom:-22px;width:25%;min-width:84px;aspect-ratio:9/19;border:4px solid #0C0C0F;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 24px 48px rgba(0,0,0,.45)}
.phone img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
@media (max-width:980px){
  .case{position:relative;top:auto;min-height:0;grid-template-columns:1fr}
  .case-r{padding-top:0;padding-bottom:calc(var(--space-card) + 22px)}
  .mock-view{height:min(80vw,480px)}
}
@media (max-width:520px){
  .story>div{grid-template-columns:1fr;gap:2px}
  .metric{grid-template-columns:minmax(0,1fr) 104px;gap:16px}
}

/* ---------- reference ---------- */
.score{display:flex;align-items:center;gap:14px;flex:none}
.score-n{font:400 clamp(48px,5vw,72px)/1 var(--serif);letter-spacing:-.03em}
.score p{font-size:14px;line-height:1.4;color:var(--ink-3)}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--space-card);display:flex;flex-direction:column;gap:calc(var(--space-card)/2)}
.q blockquote{font:400 clamp(21px,1.9vw,27px)/1.3 var(--serif);letter-spacing:-.01em}
.q-who{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.35}
.q-who img{width:44px;height:44px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.q-who span{display:block;color:var(--ink-3);font-size:14px}
.mid{margin-top:var(--gap-card);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--space-card);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-card);align-items:center}
.mid-t{font:400 clamp(26px,2.6vw,40px)/1.15 var(--serif);letter-spacing:-.02em}
.mid-s{margin-top:14px;color:var(--ink-2);font-size:16px}
.mid .cta{margin-top:0}
@media (max-width:860px){.quotes,.mid{grid-template-columns:1fr}}

/* ---------- call ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step{padding:var(--space-card);display:flex;flex-direction:column;gap:calc(var(--space-card)/2)}
.step:first-child{padding-left:0}
.step+.step{border-left:1px solid var(--line)}
.step h3{font:400 clamp(26px,2.4vw,36px)/1.1 var(--serif);letter-spacing:-.015em}
.step p{color:var(--ink-2);font-size:17px}
.call-note{margin-top:var(--space-head);font:400 clamp(26px,2.6vw,40px)/1.15 var(--serif);letter-spacing:-.02em}
@media (max-width:860px){
  .steps{grid-template-columns:1fr}
  .step{padding:var(--space-card) 0}
  .step+.step{border-left:0;border-top:1px solid var(--line)}
}

/* ---------- before / after ---------- */

(function nbsp(root) {
  const re = /(^|[\s(„])([ksvzouaiKSVZOUAI]) (?=\S)/g;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = tw.nextNode())) {
    const p = n.parentNode.nodeName;
    if (p === 'SCRIPT' || p === 'STYLE') continue;
    let t = n.nodeValue, o;
    do { o = t; t = t.replace(re, '$1$2 '); } while (t !== o);
    if (t !== n.nodeValue) n.nodeValue = t;
  }
})(document.body);

/* ---------- split headings into words ---------- */
function splitWords(el) {
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) {
        const f = document.createDocumentFragment();
        ch.nodeValue.split(/([ \n\t]+)/).forEach(part => {
          if (!part) return;
          if (/^[ \n\t]+$/.test(part)) { f.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span'); w.className = 'w';
          const i = document.createElement('span'); i.textContent = part;
          w.appendChild(i); f.appendChild(w);
        });
        ch.replaceWith(f);
      } else if (ch.nodeType === 1 && ch.tagName !== 'BR') walk(ch);
    });
  };
  walk(el);
  return $$('.w>span', el);
}
const splits = $$('.split').map(el => ({ el, words: splitWords(el) }));

(function heroGL() {

  const cs = getComputedStyle(root);
  const hex = n => { const h = cs.getPropertyValue(n).trim().replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); };
  gl.uniform3fv(u('c1'), hex('--g1')); gl.uniform3fv(u('c2'), hex('--g2')); gl.uniform3fv(u('c3'), hex('--g3'));
  const uR = u('r'), uT = u('t'), uM = u('m');
  let tm = [0, 0], mm = [0, 0], vis = true, raf = 0;
  const resize = () => {
    const s = Math.min(devicePixelRatio || 1, 1.5) * .5;
    cv.width = Math.max(1, Math.round(sec.clientWidth * s)); cv.height = Math.max(1, Math.round(sec.clientHeight * s));
    gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(uR, cv.width, cv.height);
    if (RM) frame(0);
  };
  const frame = now => {
    mm[0] += (tm[0] - mm[0]) * .05; mm[1] += (tm[1] - mm[1]) * .05;
    gl.uniform1f(uT, now / 1000); gl.uniform2f(uM, mm[0], mm[1]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  const loop = now => { frame(now); raf = vis ? requestAnimationFrame(loop) : 0; };
  sec.addEventListener('mousemove', e => { const b = sec.getBoundingClientRect(); tm = [(e.clientX - b.left) / b.width - .5, .5 - (e.clientY - b.top) / b.height]; });
  let to; addEventListener('resize', () => { clearTimeout(to); to = setTimeout(resize, 150); });
  resize();
  if (RM) return;
  new IntersectionObserver(([en]) => { vis = en.isIntersecting; if (vis && !raf) raf = requestAnimationFrame(loop); }).observe(sec);
})();

/* ---------- cell grid (hero + kontakt) ---------- */
function cellGrid(cv) {
  const sec = cv.parentElement, ctx = cv.getContext('2d'), glL = $('.gl-l');
  const density = parseFloat(cv.dataset.density) || .3;
  let W = 0, H = 0, S = 48, x0 = 0, cols = 0, rows = 0, acc = '155,133,255', vis = false, raf = 0;
  let list = [], set = new Map(), glow = new Map();
  const colAt = x => Math.floor((x - x0) / S);
  const rect = (c, r) => { const a = Math.round(x0 + c * S), b = Math.round(x0 + (c + 1) * S), y = Math.round(r * S), y2 = Math.round((r + 1) * S); return [a, y, b - a, y2 - y]; };
  const fade = c => .35 + .65 * Math.min(1, Math.abs(x0 + (c + .5) * S - W / 2) / (W / 2));
  const add = (c, r) => {
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const k = c + ',' + r; if (set.has(k)) return;
    const q = Math.random(), o = { c, r, fill: q < .08, acc: q > .98 };
    set.set(k, o); list.push(o);
  };
  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = sec.clientWidth; H = sec.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ex = glL.getBoundingClientRect().left;
    const span = W - 2 * ex, base = W < 700 ? 34 : 48;
    const n = Math.max(2, 2 * Math.round(span / 2 / base));
    S = span / n;
    x0 = ex - Math.ceil(ex / S) * S;
    cols = Math.ceil((W - x0) / S); rows = Math.ceil(H / S);
    acc = getComputedStyle(sec).getPropertyValue('--accent-rgb').trim() || acc;
    list = []; set.clear(); glow.clear();
    const seeds = Math.round(cols * rows / 46 * density);
    for (let s = 0; s < seeds; s++) {
      const q = Math.random();
      let c = q < .44 ? colAt(Math.random() * W * .26) : q < .88 ? colAt(W * .74 + Math.random() * W * .26) : Math.floor(Math.random() * cols);
      let r = Math.floor(Math.random() * rows);
      const len = 3 + Math.floor(Math.random() * 9), dx = Math.random() < .5 ? 1 : -1, dy = Math.random() < .5 ? 1 : -1;
      let h = Math.random() < .5;
      for (let k = 0; k < len; k++) { add(c, r); if (Math.random() < .42) h = !h; h ? (c += dx) : (r += dy); }
    }
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H); ctx.lineWidth = 1;
    for (const o of list) {
      const [x, y, w, h] = rect(o.c, o.r), f = fade(o.c);
      if (o.acc) { ctx.fillStyle = `rgba(${acc},${.08 + .4 * f})`; ctx.fillRect(x, y, w, h); }
      else if (o.fill) { ctx.fillStyle = 'rgba(238,237,243,.035)'; ctx.fillRect(x, y, w, h); }
      ctx.strokeStyle = `rgba(238,237,243,${.07 * f})`; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    }
    glow.forEach((v, k) => {
      const [c, r] = k.split(',').map(Number), m = set.has(k) ? 1 : .45, [x, y, w, h] = rect(c, r);
      ctx.fillStyle = `rgba(${acc},${.16 * v * m})`; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = `rgba(${acc},${.7 * v * m})`; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    });
  }
  function tick() {
    raf = 0;
    glow.forEach((v, k) => { v -= .022; v <= 0 ? glow.delete(k) : glow.set(k, v); });
    draw();
    if (vis && glow.size) raf = requestAnimationFrame(tick);
  }
  const kick = () => { if (!raf && vis && glow.size) raf = requestAnimationFrame(tick); };
  sec.addEventListener('mousemove', e => {
    const b = cv.getBoundingClientRect(), c = colAt(e.clientX - b.left), r = Math.floor((e.clientY - b.top) / S);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    glow.set(c + ',' + r, 1); kick();
  });
  if (!RM) setInterval(() => { if (!vis || !list.length) return; const o = list[Math.floor(Math.random() * list.length)]; glow.set(o.c + ',' + o.r, 1); kick(); }, 900);
  new IntersectionObserver(([en]) => { vis = en.isIntersecting; kick(); }).observe(sec);
  let to; addEventListener('resize', () => { clearTimeout(to); to = setTimeout(build, 150); });
  addEventListener('load', build);
  build();
}
$$('canvas.cells').forEach(cellGrid);

/* ---------- formulář ---------- */
(function form() {
  const f = $('.form'), st = $('.form-status', f);
  f.addEventListener('submit', e => {
    e.preventDefault();
    const n = f.name.value.trim(), m = f.email.value.trim(), w = f.web.value.trim();
    if (!n) { st.textContent = 'Napište prosím své jméno.'; f.name.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) { st.textContent = 'Zkontrolujte prosím e-mail.'; f.email.focus(); return; }
    /* Sem napojte skutečnou službu (fetch na Formspree apod.) místo mailto. */
    const subject = encodeURIComponent(`Rozbor webu zdarma: ${n}`);
    const body = encodeURIComponent(`Jméno: ${n}\nE-mail: ${m}\nWeb: ${w || '-'}`);
    location.href = `mailto:${DATA.email}?subject=${subject}&body=${body}`;
    st.textContent = 'Děkuji! Otevřel se vám e-mail, stačí zprávu odeslat. Odpovím do 48 hodin.';
  });
})();

/* ---------- služby: náhled ---------- */
(function servicePreview() {
  if (!FINE || !HAS_GSAP) return;
  const list = $('.svc'), prev = $('.svc-prev', list), imgs = $$('img', prev), rows = $$('.svc-row', list);
  let shown = false;
  rows.forEach((row, i) => row.addEventListener('mouseenter', () => {
    if (innerWidth <= 860) return;
    const band = $('.svc-band', row);
    const x = row.offsetLeft + band.offsetLeft;
    const y = row.offsetTop + row.offsetHeight / 2 - prev.offsetHeight / 2;
    imgs.forEach((im, j) => im.classList.toggle('on', j === i));
    if (!shown) { gsap.set(prev, { x, y, scale: .92 }); shown = true; }
    gsap.to(prev, { x, y, opacity: 1, scale: 1, duration: .7, ease: 'expo.out', overwrite: 'auto' });
  }));
  list.addEventListener('mouseleave', () => { shown = false; gsap.to(prev, { opacity: 0, scale: .92, duration: .4, ease: 'power2.out', overwrite: 'auto' }); });
})();

/* ---------- about: slova ---------- */
const aboutP = $('.about-p');
(function splitAbout() {
  const walk = node => [...node.childNodes].forEach(ch => {
    if (ch.nodeType === 3) {
      const f = document.createDocumentFragment();
      ch.nodeValue.split(/([ \n\t]+)/).forEach(p => {
        if (!p) return;
        if (/^[ \n\t]+$/.test(p)) { f.appendChild(document.createTextNode(' ')); return; }
        const s = document.createElement('span'); s.className = 'aw'; s.textContent = p; f.appendChild(s);
      });
      ch.replaceWith(f);
    } else if (ch.nodeType === 1) walk(ch);
  });
  walk(aboutP);
})();

/* ---------- reduced motion / bez GSAP: vše viditelné ---------- */
if (!ANIM) {
  if (HAS_GSAP) $$('.ba-row').forEach(r => r.classList.add('on'));
  return;
}

/* =====================================================================
   POHYB
   ===================================================================== */
const E = 'expo.out';

/* hero H1 */
const heroWords = splits.find(s => s.el.classList.contains('h1')).words;
gsap.fromTo(heroWords, { y: 0, yPercent: 120 }, { yPercent: 0, duration: 1.3, ease: E, stagger: .09, delay: .15 });

/* ostatní nadpisy */
splits.filter(s => !s.el.classList.contains('h1')).forEach(({ el, words }) => {
  gsap.set(words, { y: 0, yPercent: 120 });
  ScrollTrigger.create({ trigger: el, start: 'top 85%', once: true, onEnter: () => gsap.to(words, { yPercent: 0, duration: 1.2, ease: E, stagger: .06 }) });
});

/* .rv */
gsap.set('.rv', { opacity: 0, y: 32 });
ScrollTrigger.batch('.rv', { start: 'top 88%', once: true, onEnter: b => gsap.to(b, { opacity: 1, y: 0, duration: 1.1, ease: E, stagger: .08, overwrite: true }) });

/* count-up */
$$('[data-count]').forEach(el => {
  const end = parseFloat(el.dataset.count), pre = el.dataset.pre || '', suf = el.dataset.suf || '';
  const set = v => { el.textContent = pre + fmt(v) + suf; };
  set(0);
  ScrollTrigger.create({
    trigger: el, start: 'top 92%', once: true,
    onEnter: () => { const o = { v: 0 }; gsap.to(o, { v: end, duration: 1.8, ease: 'power3.out', onUpdate: () => set(Math.round(o.v)), onComplete: () => set(end) }); }
  });
});

/* impact lines */
gsap.fromTo('.imp-line', { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: E, stagger: .12, delay: .4 });

/* cases */
const cases = $$('.case');
cases.forEach(c => {
  const n = $('.m-n', c), bars = $$('.bar i', c), img = $('.mock-view img', c);
  gsap.set(n, { yPercent: 100 }); gsap.set(bars, { scaleY: 0 });
  ScrollTrigger.create({
    trigger: c, start: 'top 75%', once: true,
    onEnter: () => { gsap.to(n, { yPercent: 0, duration: 1.2, ease: E }); gsap.to(bars, { scaleY: 1, duration: 1.3, ease: E, stagger: .14, delay: .15 }); }
  });
  gsap.fromTo(img, { yPercent: -8 }, { yPercent: 0, ease: 'none', scrollTrigger: { trigger: c, start: 'top bottom', end: 'bottom top', scrub: true } });
});
const mm = gsap.matchMedia();
mm.add('(min-width: 981px)', () => {
  cases.forEach((c, i) => {
    const next = cases[i + 1]; if (!next) return;
    const st = { trigger: next, start: 'top 80%', end: 'top 12%', scrub: .3 };
    gsap.to(c, { scale: .95, force3D: true, ease: 'none', scrollTrigger: st });
    gsap.to($('.case-shade', c), { opacity: .35, ease: 'none', scrollTrigger: { ...st } });
  });
});

/* before / after */
$$('.ba-row').forEach(r => ScrollTrigger.create({ trigger: r, start: 'top 70%', once: true, onEnter: () => r.classList.add('on') }));

/* about */
const ph = $('.ph'), phImg = $('.ph img');
gsap.set(ph, { clipPath: 'inset(18% 0% 0% 0%)' });
ScrollTrigger.create({ trigger: ph, start: 'top 85%', once: true, onEnter: () => gsap.to(ph, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.4, ease: E }) });
gsap.fromTo(phImg, { yPercent: -8 }, { yPercent: 0, ease: 'none', scrollTrigger: { trigger: '#o-mne', start: 'top bottom', end: 'bottom top', scrub: true } });
gsap.fromTo($$('.aw', aboutP), { opacity: .22 }, { opacity: 1, stagger: .1, ease: 'none', scrollTrigger: { trigger: aboutP, start: 'top 75%', end: 'bottom 50%', scrub: true } });

/* finale */
const fl = $$('.fl>span');
gsap.set(fl, { y: 0, yPercent: 120 });
ScrollTrigger.create({ trigger: '.fin-h', start: 'top 85%', once: true, onEnter: () => gsap.to(fl, { yPercent: 0, duration: 1.4, ease: E, stagger: .12 }) });

addEventListener('load', () => ScrollTrigger.refresh());
})();
</script>
