backend:
  name: github
  branch: master
  repo: vladkamarketing-bit/vladka-web
  site_domain: vladka-web.vercel.app
  base_url: https://vladka-web.vercel.app
  auth_endpoint: oauth

locale: "cs"

media_folder: public/images
public_folder: /images

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "pages"
    label: "Stránky"
    files:
      - name: "homepage"
        label: "Hlavní stránka"
        file: "src/content/homepage.json"
        fields:
          - { label: "Nadpis hero", name: "heroTitle", widget: "string" }
          - { label: "Nadpis hero - 2. řádek (kurzíva)", name: "heroTitleLine2", widget: "string" }
          - { label: "Popis hero", name: "heroSubtitle", widget: "text" }
          - { label: "Kicker - Můj přístup", name: "approachKicker", widget: "string" }
          - { label: "Nadpis - Můj přístup", name: "approachTitle", widget: "string" }
          - { label: "Popis - Můj přístup", name: "approachText", widget: "text" }
          - label: "Karty - Můj přístup"
            name: "approachCards"
            widget: "list"
            fields:
              - { label: "Název karty", name: "title", widget: "string" }
              - { label: "Text karty", name: "text", widget: "text" }
          - { label: "Kicker - Služby", name: "servicesKicker", widget: "string" }
          - { label: "Nadpis - Služby", name: "servicesTitle", widget: "string" }
          - { label: "Popis - Služby", name: "servicesText", widget: "text" }
          - { label: "Hlavní karta - popisek", name: "servicesMainLabel", widget: "string" }
          - { label: "Hlavní karta - název", name: "servicesMainTitle", widget: "string" }
          - { label: "Hlavní karta - text", name: "servicesMainText", widget: "text" }
          - { label: "Hlavní karta - cena", name: "servicesMainPrice", widget: "string" }
          - { label: "Hlavní karta - text tlačítka", name: "servicesMainButton", widget: "string" }
          - label: "Hlavní karta - checklist"
            name: "servicesChecklist"
            widget: "list"
          - label: "Služby - 2 barevné karty"
            name: "servicesCards2"
            widget: "list"
            fields:
              - { label: "Popisek", name: "label", widget: "string" }
              - { label: "Název", name: "title", widget: "string" }
              - { label: "Cena", name: "price", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Odkaz (nepovinné)", name: "link", widget: "string", required: false, hint: "Např. /chovatel. Prázdné = karta bez odkazu." }
              - { label: "Text odkazu (nepovinné)", name: "linkLabel", widget: "string", required: false }
          - label: "Služby - 3 bílé karty"
            name: "servicesCards3"
            widget: "list"
            fields:
              - { label: "Název", name: "name", widget: "string" }
              - { label: "Cena", name: "price", widget: "string" }
              - { label: "Text", name: "desc", widget: "text" }
          - { label: "Kicker - O mně", name: "aboutKicker", widget: "string" }
          - { label: "Fotka - O mně", name: "aboutPhoto", widget: "image", required: false }
          - { label: "Jméno - O mně", name: "aboutName", widget: "string" }
          - { label: "Podtitul - O mně", name: "aboutSubtitle", widget: "string" }
          - label: "Odstavce - O mně"
            name: "aboutParagraphs"
            widget: "list"
          - { label: "Kicker - Portfolio", name: "portfolioKicker", widget: "string" }
          - { label: "Nadpis - Portfolio", name: "portfolioTitle", widget: "string" }
          - { label: "Popis - Portfolio", name: "portfolioText", widget: "text" }
          - label: "Projekty - Portfolio"
            name: "portfolioProjects"
            widget: "list"
            fields:
              - { label: "Fotka projektu", name: "image", widget: "image", required: false }
              - { label: "Odkaz na web (např. https://www.loveckaskola.cz)", name: "url", widget: "string", required: false, hint: "Po kliknutí na obrázek se web otevře v novém okně. Nechte prázdné, pokud web nemá být proklikávací." }
              - { label: "Štítky (oddělené čárkou)", name: "tags", widget: "string", required: false, hint: "Např. Web, UX, SEO. Může zůstat prázdné." }
              - { label: "Název projektu", name: "title", widget: "string", hint: "Povinné - bez názvu nejde uložit." }
              - { label: "Popis", name: "desc", widget: "text", required: false }
          - { label: "Kicker - Reference", name: "testimonialsKicker", widget: "string" }
          - { label: "Nadpis - Reference", name: "testimonialsTitle", widget: "string" }
          - label: "Reference - citace klientů"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Citace", name: "quote", widget: "text" }
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Firma / role", name: "role", widget: "string" }
          - { label: "Nadpis - CTA", name: "ctaTitle", widget: "string" }
          - { label: "Text - CTA", name: "ctaText", widget: "text" }
          - { label: "Text tlačítka - CTA", name: "ctaButton", widget: "string" }
          - { label: "Kicker - FAQ", name: "faqKicker", widget: "string" }
          - { label: "Nadpis - FAQ", name: "faqTitle", widget: "string" }
          - label: "Otázky a odpovědi - FAQ"
            name: "faqItems"
            widget: "list"
            fields:
              - { label: "Otázka", name: "q", widget: "string" }
              - { label: "Odpověď", name: "a", widget: "text" }
          - { label: "Kicker - Kontakt", name: "contactKicker", widget: "string" }
          - { label: "Nadpis - Kontakt", name: "contactTitle", widget: "string" }
          - { label: "Text - Kontakt", name: "contactText", widget: "text" }
          - { label: "E-mail - Kontakt", name: "contactEmail", widget: "string" }
      - name: "chovatel"
        label: "Stránka pro chovatele (/chovatel)"
        file: "src/content/chovatel.json"
        fields:
          - { label: "Úvod - kicker", name: "heroKicker", widget: "string" }
          - { label: "Úvod - nadpis", name: "heroTitle", widget: "string" }
          - { label: "Úvod - nadpis 2. řádek (kurzíva)", name: "heroTitleLine2", widget: "string" }
          - { label: "Úvod - text", name: "heroText", widget: "text" }
          - { label: "Úvod - tlačítko", name: "heroButton", widget: "string" }
          - { label: "Úvod - odkaz na šablony", name: "heroLink", widget: "string" }
          - { label: "Úvod - výhody s fajfkou", name: "heroChecks", widget: "list" }
          - { label: "Úvod - obrázek v notebooku", name: "heroImage", widget: "image" }
          - { label: "Úvod - obrázek v telefonu", name: "heroPhoneImage", widget: "image" }
          - { label: "Rozcestník: web pro psa - popisek", name: "dogCardLabel", widget: "string" }
          - { label: "Rozcestník: web pro psa - nadpis", name: "dogCardTitle", widget: "string" }
          - { label: "Rozcestník: web pro psa - text", name: "dogCardText", widget: "text" }
          - { label: "Rozcestník: web pro psa - odkaz", name: "dogCardLink", widget: "string" }
          - { label: "Rozcestník: web stanice - popisek", name: "kennelCardLabel", widget: "string" }
          - { label: "Rozcestník: web stanice - nadpis", name: "kennelCardTitle", widget: "string" }
          - { label: "Rozcestník: web stanice - text", name: "kennelCardText", widget: "text" }
          - { label: "Rozcestník: web stanice - odkaz", name: "kennelCardLink", widget: "string" }
          - { label: "Web pro psa - kicker", name: "dogKicker", widget: "string" }
          - { label: "Web pro psa - nadpis", name: "dogTitle", widget: "string" }
          - { label: "Web pro psa - nadpis 2. řádek (kurzíva)", name: "dogTitleLine2", widget: "string" }
          - { label: "Web pro psa - text", name: "dogText", widget: "text" }
          - { label: "Web pro psa - co web obsahuje", name: "dogFeatures", widget: "list" }
          - label: "Web pro psa - vzhledy"
            name: "dogDesigns"
            widget: "list"
            fields:
              - { label: "Skupina", name: "group", widget: "string" }
              - label: "Vzhledy"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Název", name: "name", widget: "string", hint: "Název se objeví i ve formuláři poptávky." }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Obrázek", name: "img", widget: "image" }
          - label: "Web pro psa - ukázky v mobilu"
            name: "dogHighlights"
            widget: "list"
            fields:
              - { label: "Nadpis", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Obrázek", name: "img", widget: "image" }
          - { label: "Web pro psa - tlačítko", name: "dogButton", widget: "string" }
          - { label: "Web stanice - kicker", name: "kennelKicker", widget: "string" }
          - { label: "Web stanice - nadpis", name: "kennelTitle", widget: "string" }
          - { label: "Web stanice - nadpis 2. řádek (kurzíva)", name: "kennelTitleLine2", widget: "string" }
          - { label: "Web stanice - text", name: "kennelText", widget: "text" }
          - label: "Web stanice - stránky webu"
            name: "kennelPages"
            widget: "list"
            fields:
              - { label: "Název", name: "name", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Web stanice - ukázky v mobilu"
            name: "kennelHighlights"
            widget: "list"
            fields:
              - { label: "Nadpis", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Obrázek", name: "img", widget: "image" }
          - { label: "Vzhled - kicker", name: "designsKicker", widget: "string" }
          - { label: "Vzhled - nadpis", name: "designsTitle", widget: "string" }
          - label: "Web stanice - designy"
            name: "kennelDesigns"
            widget: "list"
            fields:
              - { label: "Název", name: "name", widget: "string", hint: "Název se objeví i ve formuláři poptávky." }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Obrázek", name: "img", widget: "image" }
          - label: "Barevné varianty"
            name: "colors"
            widget: "list"
            fields:
              - { label: "Název", name: "name", widget: "string" }
              - { label: "Barva", name: "hex", widget: "color" }
          - { label: "Barevné varianty - poznámka", name: "colorsNote", widget: "string" }
          - { label: "Web stanice - tlačítko", name: "kennelButton", widget: "string" }
          - { label: "Jak to probíhá - kicker", name: "stepsKicker", widget: "string" }
          - { label: "Jak to probíhá - nadpis", name: "stepsTitle", widget: "string" }
          - label: "Jak to probíhá - kroky"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Nadpis", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Jak to probíhá - poznámka", name: "stepsNote", widget: "text" }
          - { label: "Poptávka - kicker", name: "formKicker", widget: "string" }
          - { label: "Poptávka - nadpis", name: "formTitle", widget: "string" }
          - { label: "Poptávka - nadpis 2. řádek (kurzíva)", name: "formTitleLine2", widget: "string" }
          - { label: "Poptávka - text", name: "formText", widget: "text" }
          - { label: "Poptávka - tlačítko odeslat", name: "formButton", widget: "string" }
          - { label: "Poptávka - zpráva po odeslání", name: "formSuccess", widget: "text" }
          - { label: "Poptávka - zpráva při chybě", name: "formError", widget: "text" }
